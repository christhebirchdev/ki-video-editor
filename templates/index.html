<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meinfluss · KI Video Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#F4EEE3;
    --cream-deep:#EFE7D7;
    --paper:#FFFFFF;
    --paper-alt:#FBF8F1;
    --ink:#221E18;
    --ink-2:#3C352B;
    --taupe:#6F665A;
    --taupe-soft:#938876;
    --gold:#BD9F66;
    --gold-deep:#A6863F;
    --gold-press:#937638;
    --gold-tint:#EFE7D4;
    --gold-tint-2:#F6F1E4;
    --line:#E5DECF;
    --line-strong:#DAD2C2;
    --err-ink:#A83A33;
    --err-bg:#F7E7E3;
    --err-line:#E9CCC5;
    --ok-ink:#5E7A47;
    --ok-bg:#EAEFDC;
    --ok-line:#D6DEBE;
    --radius:16px;
    --radius-sm:12px;
    --shadow:0 1px 2px rgba(34,30,24,.04), 0 8px 24px rgba(34,30,24,.06);
    --shadow-sm:0 1px 2px rgba(34,30,24,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    background:var(--cream);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  #root{min-height:100vh;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  ::selection{background:var(--gold-tint);}
</style>
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="/static/app.jsx"></script>
</body>
</html>
