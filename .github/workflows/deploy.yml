name: Deploy to VPS

# Auto-Deploy: Push auf main → der Self-hosted Runner (läuft AUF dem VPS) zieht den
# Code neu und baut den Analyst-Container neu. Kein SSH, keine Secrets nötig, weil
# der Runner die Befehle direkt lokal auf dem Server ausführt.
# Voraussetzung (einmalig): Self-hosted Runner für DIESES Repo registriert (als root,
# damit docker + /docker/analyst zugänglich sind).

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull & Rebuild
        run: |
          cd /docker/analyst
          git pull origin main
          docker compose up -d --build
          echo "✅ Deploy erfolgreich: $(date)"
